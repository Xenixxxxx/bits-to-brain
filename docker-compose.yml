version: '3.8'

services:
  neo4j:
    image: neo4j:5.15
    container_name: neo4j-dev
    restart: always
    ports:
      - 7474:7474    # Neo4j Browser
      - 7687:7687    # Bolt protocol for driver
    environment:
      NEO4J_AUTH: neo4j/test123123    # username/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_connector_bolt_advertised__address: localhost:7687
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/plugins:/plugins
